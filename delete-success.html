<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Submitted - Offline Story Life</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            color: #333;
        }

        .container {
            max-width: 650px;
            margin: 80px auto;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #673ab7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            color: #673ab7;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.7;
        }

        .email {
            font-weight: bold;
            color: #673ab7;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 24px;
            background: #673ab7;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }

        .button:hover {
            background: #512da8;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }

            .container {
                margin: 40px auto;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">✓</div>

        <h1>Request Submitted</h1>

        <p>
            Your account deletion request has been submitted successfully.
        </p>

        <p>
            We have received your request and will review it.
        </p>

        <p>
            For any questions or additional information,
            please contact us at:
        </p>

        <p class="email">
            dequexsupport15@gmail.com
        </p>

        <a href="index.html" class="button">
            Back to Privacy Policy
        </a>

    </div>

</div>

</body>
</html>
